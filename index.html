<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Input Hasil Produksi FG</title>
<link rel="manifest" href="manifest-fg.json">
<meta name="theme-color" content="#1D4E89">
<link rel="icon" href="icon-fg-192.png">
<link rel="apple-touch-icon" href="icon-fg-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-title" content="Hasil FG">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root{--bg:#F3F4F6;--card:#FFF;--ink:#14181F;--mute:#5B6472;--line:#E3E6EA;--accent:#1D4E89;--good:#157F3C;--bad:#B91C1C;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .topbar{background:var(--accent);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;position:sticky;top:0;z-index:5;}
  .topbar h1{font-size:17px;font-weight:800;margin:0;letter-spacing:.02em;}
  .wrap{padding:12px 12px 28px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mute);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,78,137,.15);}
  input:disabled,select:disabled{background:#F3F4F6;color:var(--mute);}

  .scroll{overflow-x:auto;}
  table{border-collapse:collapse;font-size:12.5px;min-width:700px;width:100%;}
  th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;}
  th{font-size:10.5px;color:var(--mute);text-transform:uppercase;white-space:nowrap;}
  td input,td select{width:100%;padding:7px 6px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}
  td.c-qty input,td.c-gram input,td.c-bs input,td.c-waste input,td.c-saldo input{text-align:right;}
  td.c-prod select{min-width:170px;}
  .del{border:none;background:none;color:var(--bad);font-size:16px;cursor:pointer;padding:4px;}
  .del:disabled{opacity:.4;cursor:not-allowed;}
  .add{width:100%;padding:11px;margin-top:10px;border:1px dashed var(--accent);background:#fff;color:var(--accent);border-radius:8px;font-weight:700;cursor:pointer;}
  .add:disabled{opacity:.4;}

  .btn{width:100%;padding:14px;font-size:15px;font-weight:700;border:none;border-radius:10px;color:#fff;cursor:pointer;margin-top:10px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  #btnSave{background:var(--accent);}
  #btnPrint{background:#B45309;}
  #btnShare{background:#25D366;}
  #btnUlang{background:#fff;color:var(--accent);border:1px solid var(--accent);}
  #btnReset{background:#fff;color:var(--mute);border:1px solid var(--line);font-size:13px;padding:12px;}

  #palletInfo{display:none;}
  #palletInfo .jdl{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mute);margin-bottom:6px;}
  #palletInfo .r{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px;}
  #palletInfo .r:first-of-type{border-top:none;}
  #palletInfo .r .p{font-family:'Roboto Mono',monospace;font-weight:700;}
  #palletInfo .r .d{color:var(--mute);text-align:right;}

  #msg{font-size:13px;margin-top:10px;min-height:18px;text-align:center;}
  #msg.ok{color:var(--good);font-weight:700;} #msg.bad{color:var(--bad);font-weight:700;}

  #ulangPanel{display:none;}
  .ul-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .ul-head b{font-size:14px;}
  .ul-head button{background:none;border:none;font-size:13px;color:var(--mute);cursor:pointer;font-weight:700;}
  .ul-cari{display:flex;gap:8px;margin-bottom:10px;}
  .ul-cari input{flex:1;padding:11px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;}
  .ul-cari button{padding:11px 16px;font-size:14px;font-weight:700;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;}
  .ul-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
  .ul-item .t{font-weight:800;font-size:14px;font-family:'Roboto Mono',monospace;}
  .ul-item .s{color:var(--mute);font-size:11.5px;margin-top:3px;}
  .ul-item button{margin-top:8px;width:100%;padding:10px;border:none;border-radius:8px;background:#B45309;color:#fff;font-weight:700;font-size:13px;cursor:pointer;}

  #kitirPrintArea{display:none;}
  .kitir{width:54mm;margin:0;font-family:'Roboto Mono',monospace;color:#000;padding:0;}
  .kitir .tag{text-align:center;font-size:11px;font-weight:700;}
  .kitir .brand{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;}
  .kitir .judul{text-align:center;font-size:11.5px;font-weight:700;margin:1px 0 3px;}
  .kitir hr{border:none;border-top:1px dashed #000;margin:3px 0;}
  .kitir .ref{text-align:center;font-size:11px;font-weight:700;margin:1px 0 3px;}
  .kitir .nama{text-align:center;font-size:12px;font-weight:700;margin:3px 0;word-break:break-word;}
  .kitir .berat-wrap{text-align:center;margin:4px 0;}
  .kitir .berat-wrap .lbl{font-size:8.5px;letter-spacing:.08em;}
  .kitir .berat-wrap .val{font-size:20px;font-weight:700;line-height:1.1;}
  .kitir .rute{text-align:center;font-size:14px;font-weight:700;margin:3px 0;}
  .kitir .foot{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-top:3px;}
  .kitir .barcode-wrap{text-align:center;margin-top:5px;}
  .kitir .barcode-wrap svg{max-width:52mm;height:24mm;}
  @media print{
    body *{visibility:hidden;}
    #kitirPrintArea, #kitirPrintArea *{visibility:visible;}
    #kitirPrintArea{display:block;position:absolute;top:0;left:0;width:54mm;}
    .kitir{page-break-after:always;}
    .kitir:last-child{page-break-after:auto;}
    @page{size:58mm auto;margin:0;}
  }
</style>
</head>
<body>

<div class="topbar"><h1>INPUT HASIL PRODUKSI</h1></div>

<div class="wrap">
  <div class="card" id="cardHead">
    <div class="row2">
      <div class="field"><label>Tanggal</label><input type="date" id="fTanggal"></div>
      <div class="field"><label>Shift</label>
        <select id="fShift"><option value="">- pilih -</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
      </div>
    </div>
    <div class="field" style="margin-top:12px"><label>Nama Operator</label><select id="fNama"></select></div>
  </div>

  <div class="card" id="cardTabel">
    <div class="scroll">
      <table>
        <thead>
          <tr><th>TF</th><th>Nama Produk</th><th>Qty</th><th>Gram</th><th>BS Sheet</th><th>Waste</th><th>Saldo Akhir</th><th></th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <button type="button" class="add" id="btnAdd" onclick="fgTambahBaris()">+ Tambah baris</button>
  </div>

  <div class="card" id="palletInfo"></div>

  <button id="btnSave" class="btn" onclick="fgSimpan()">Simpan</button>
  <button id="btnPrint" class="btn" onclick="fgCetak()" disabled>Cetak</button>
  <button id="btnShare" class="btn" onclick="fgShareWa()" disabled>Share WA</button>
  <button id="btnUlang" class="btn" onclick="fgBukaCari()">Cari Cetak Ulang</button>
  <button id="btnReset" class="btn" onclick="fgKosongkan()">Kosongkan Form</button>
  <div id="msg"></div>

  <div class="card" id="ulangPanel" style="margin-top:14px">
    <div class="ul-head">
      <b>Cari Cetak Ulang</b>
      <button type="button" onclick="fgTutupCari()">Tutup ✕</button>
    </div>
    <div class="ul-cari">
      <input type="text" id="ulCari" placeholder="No. palet, mis. FG-26/11/001" autocapitalize="characters" autocomplete="off" onkeydown="if(event.key==='Enter'){fgCariPalet();}">
      <button type="button" onclick="fgCariPalet()">Cari</button>
    </div>
    <div id="ulangList"></div>
  </div>
</div>

<div id="kitirPrintArea"></div>

<script>
var WEBAPP_URL='https://script.google.com/macros/s/AKfycbxp5L0rGdC0ki2M18YjNnylr0aAOXDLCzW5k84fJhT7aCkdlFrPeOY2tH0b75MMjDJh/exec';
var TF_LIST=['TF04','TF05','TF07','TF08','TF09','TF10','TF12','TF13','TF14','TF15','TF16'];
var OPERATOR_LIST=['Agus','Eka','Ido','Niko'];
var PRODUK_LIST=[];
var FG_KEY='fgBatchSaved';
var fgState=null;   // { sid, lines } setelah simpan sukses
var fgDraft=null;   // { sid, key, jam } untuk retry, supaya tidak ganda
var fgCache=[];     // hasil cari palet untuk cetak ulang

function setMsg(t,c){ var m=document.getElementById('msg'); m.textContent=t; m.className=c||''; }
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function tanggalHariIni(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function jamSekarang(){ var n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
function fmtTglIndo(iso){ var p=String(iso||'').split('-'); return p.length===3 ? p[2]+'-'+p[1]+'-'+p[0] : (iso||''); }
function fmtN(n){ return Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:2}); }
function fgNewSid(){ return 'F'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// Pilihan dropdown; nilai tersimpan tetap tampil walau tidak ada di daftar
function fgOpt(list, sel){
  var l=list.slice();
  if(sel && l.indexOf(sel)===-1) l.push(sel);
  var h='<option value="">- pilih -</option>';
  l.forEach(function(v){ h+='<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(v)+'</option>'; });
  return h;
}

function fgTambahBaris(d){
  d=d||{};
  var tr=document.createElement('tr');
  tr.innerHTML=
    '<td class="c-tf"><select>'+fgOpt(TF_LIST,d.tf)+'</select></td>'+
    '<td class="c-prod"><select>'+fgOpt(PRODUK_LIST,d.produk)+'</select></td>'+
    '<td class="c-qty"><input type="number" step="1" inputmode="numeric" value="'+esc(d.qty)+'"></td>'+
    '<td class="c-gram"><input type="number" step="any" inputmode="decimal" value="'+esc(d.gram)+'"></td>'+
    '<td class="c-bs"><input type="number" step="any" inputmode="decimal" value="'+esc(d.bs)+'"></td>'+
    '<td class="c-waste"><input type="number" step="any" inputmode="decimal" value="'+esc(d.waste)+'"></td>'+
    '<td class="c-saldo"><input type="number" step="any" inputmode="decimal" value="'+esc(d.saldo)+'"></td>'+
    '<td><button type="button" class="del" onclick="fgHapusBaris(this)">✕</button></td>';
  document.getElementById('tbody').appendChild(tr);
}

function fgHapusBaris(btn){
  var tr=btn.closest('tr');
  var tb=document.getElementById('tbody');
  if(tb.rows.length>1){ tr.remove(); return; }
  tr.querySelectorAll('input').forEach(function(i){ i.value=''; });
  tr.querySelectorAll('select').forEach(function(s){ s.value=''; });
}

function fgAmbilBaris(){
  return Array.prototype.map.call(document.querySelectorAll('#tbody tr'), function(tr){
    return {
      tf: tr.querySelector('.c-tf select').value,
      produk: tr.querySelector('.c-prod select').value,
      qty: tr.querySelector('.c-qty input').value.trim(),
      gram: tr.querySelector('.c-gram input').value.trim(),
      bs: tr.querySelector('.c-bs input').value.trim(),
      waste: tr.querySelector('.c-waste input').value.trim(),
      saldo: tr.querySelector('.c-saldo input').value.trim()
    };
  });
}

function fgValidasi(rows){
  if(!document.getElementById('fTanggal').value) return 'Tanggal belum diisi';
  if(!document.getElementById('fShift').value) return 'Shift belum dipilih';
  if(!document.getElementById('fNama').value) return 'Nama operator belum dipilih';
  if(!rows.length) return 'Belum ada baris';
  for(var i=0;i<rows.length;i++){
    var r=rows[i], no=i+1;
    if(!r.tf) return 'Baris '+no+': TF belum dipilih';
    if(!r.produk) return 'Baris '+no+': Nama produk belum dipilih';
    if(!r.qty||isNaN(parseFloat(r.qty))||parseFloat(r.qty)<=0) return 'Baris '+no+': Qty belum valid';
  }
  return null;
}

// on=true: kunci semua isian (sudah tersimpan)
function fgKunci(on){
  document.querySelectorAll('#cardHead input, #cardHead select, #cardTabel input, #cardTabel select').forEach(function(el){ el.disabled=on; });
  document.querySelectorAll('#cardTabel .del').forEach(function(b){ b.disabled=on; });
  document.getElementById('btnAdd').disabled=on;
  document.getElementById('btnSave').disabled=on;
}

// 1. Simpan semua baris. Satu nomor palet untuk setiap baris.
function fgSimpan(){
  if(fgState){ setMsg('Data sudah tersimpan. Pakai Cetak, atau Kosongkan Form untuk input baru.','bad'); return; }
  var rows=fgAmbilBaris();
  var err=fgValidasi(rows);
  if(err){ setMsg(err,'bad'); return; }

  var hdr={ tanggal:document.getElementById('fTanggal').value, shift:document.getElementById('fShift').value, nama:document.getElementById('fNama').value };
  var key=JSON.stringify({h:hdr, r:rows});
  if(!fgDraft||fgDraft.key!==key){ fgDraft={sid:fgNewSid(), key:key, jam:jamSekarang()}; }
  var sid=fgDraft.sid, jam=fgDraft.jam;

  var payload={_app:'fgbatch', sid:sid, tanggal:hdr.tanggal, shift:hdr.shift, nama:hdr.nama, jam:jam, rows:rows};
  var btn=document.getElementById('btnSave');
  btn.disabled=true; setMsg('Menyimpan '+rows.length+' palet...','');

  fetch(WEBAPP_URL+'?action=save&payload='+encodeURIComponent(JSON.stringify(payload)))
    .then(function(r){ return r.text(); })
    .then(function(t){
      var res;
      try{ res=JSON.parse(t); }catch(e){ res={ok:false,error:'Respon server: '+t.slice(0,200)}; }
      if(res&&res.ok&&res.items&&res.items.length){
        var lines=res.items.map(function(it,i){
          return {
            palet: it.palet, tf: it.tf, produk: it.namaProduk, qty: it.qty, gram: it.gram,
            bs: rows[i]?rows[i].bs:'', waste: rows[i]?rows[i].waste:'', saldo: rows[i]?rows[i].saldo:'',
            tanggal: hdr.tanggal, jam: jam, shift: hdr.shift, nama: hdr.nama
          };
        });
        fgSelesaiSimpan(sid, lines, !!res.duplicate);
      } else {
        btn.disabled=false;
        setMsg('❌ Gagal: '+((res&&res.error)||'Server tidak mengembalikan No. Palet')+'. Tekan Simpan lagi, data tidak akan ganda.','bad');
      }
    })
    .catch(function(e){
      btn.disabled=false;
      setMsg('❌ Gagal: '+e.message+'. Tekan Simpan lagi, data tidak akan ganda.','bad');
    });
}

function fgSelesaiSimpan(sid, lines, dup){
  fgState={sid:sid, lines:lines};
  fgDraft=null;
  try{ localStorage.setItem(FG_KEY, JSON.stringify(fgState)); }catch(e){}
  fgKunci(true);
  document.getElementById('btnPrint').disabled=false;
  document.getElementById('btnShare').disabled=false;
  fgTampilPalet(lines);
  setMsg((dup?'Data sudah tersimpan sebelumnya. ':'✅ Tersimpan. ')+lines.length+' palet dibuat. Tekan Cetak untuk cetak semua.', 'ok');
}

function fgTampilPalet(lines){
  var box=document.getElementById('palletInfo');
  var h='<div class="jdl">No. Palet dibuat</div>';
  lines.forEach(function(l){
    h+='<div class="r"><span class="p">'+esc(l.palet)+'</span><span class="d">'+esc(l.produk)+'<br>TF '+esc(l.tf)+' · '+fmtN(l.qty)+' Box</span></div>';
  });
  box.innerHTML=h;
  box.style.display='block';
}

// 2. Cetak semua palet dari data yang tersimpan (bisa diulang)
function fgCetak(){
  if(!fgState){ setMsg('Belum ada data tersimpan.','bad'); return; }
  fgCetakLabels(fgState.lines, false);
}

function fgLabelHtml(it, i, ulang){
  return '<div class="kitir">'+
    (ulang?'<div class="tag">** CETAK ULANG **</div>':'')+
    '<div class="brand">STP</div>'+
    '<div class="judul">HASIL PRODUKSI FG</div>'+
    '<div class="ref">No. Palet: '+esc(it.palet)+'</div><hr>'+
    '<div class="nama">'+esc(it.produk)+'</div>'+
    '<div class="berat-wrap"><div class="lbl">QTY</div><div class="val">'+fmtN(it.qty)+' Box</div></div>'+
    (it.gram?'<div class="ref">Gram: '+fmtN(it.gram)+'</div>':'')+
    '<div class="rute">'+esc(it.tf)+'</div><hr>'+
    '<div class="foot"><span>'+fmtTglIndo(it.tanggal)+' '+esc(it.jam)+'</span><span>SHIFT '+esc(it.shift)+'</span></div>'+
    '<div class="foot"><span>Operator:</span><span>'+esc(it.nama)+'</span></div>'+
    '<div class="barcode-wrap"><svg id="bc'+i+'"></svg></div>'+
    '</div>';
}

function fgCetakLabels(items, ulang){
  var area=document.getElementById('kitirPrintArea');
  area.innerHTML=items.map(function(it,i){ return fgLabelHtml(it,i,ulang); }).join('');
  items.forEach(function(it,i){
    try{ JsBarcode('#bc'+i, String(it.palet), {format:'CODE128', width:1.3, height:55, displayValue:true, fontSize:11, margin:2}); }catch(e){}
  });
  setTimeout(function(){ window.print(); }, 300);
}

// 3. Share WA: semua palet dalam satu pesan, dari data yang tersimpan
function fgShareWa(){
  if(!fgState){ setMsg('Simpan dulu','bad'); return; }
  var l=fgState.lines, h=l[0];
  var t="📦 HASIL PRODUKSI FG\n"+
    "Tanggal: "+fmtTglIndo(h.tanggal)+" | Jam: "+h.jam+"\n"+
    "Shift: "+h.shift+" | Operator: "+h.nama+"\n";
  l.forEach(function(it,i){
    t+="\n"+(i+1)+". "+it.palet+"\n"+
       "   "+it.produk+" | "+it.tf+"\n"+
       "   Qty "+fmtN(it.qty)+" Box"+(it.gram?" | Gram "+fmtN(it.gram):"")+"\n";
  });
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
  setMsg('WhatsApp dibuka. Data masih ada di form.','ok');
}

// 4. Cari cetak ulang: ketik no. palet, hasil hanya dibaca
function fgBukaCari(){
  var p=document.getElementById('ulangPanel');
  p.style.display='block';
  document.getElementById('ulCari').focus();
  p.scrollIntoView({behavior:'smooth'});
}

function fgTutupCari(){ document.getElementById('ulangPanel').style.display='none'; }

function fgCariPalet(){
  var kode=document.getElementById('ulCari').value.trim();
  var list=document.getElementById('ulangList');
  if(!kode){ list.innerHTML='<div style="color:#B91C1C;font-weight:700">Ketik no. palet dulu.</div>'; return; }
  list.innerHTML='<div style="color:var(--mute);font-size:12.5px">Mencari...</div>';
  fetch(WEBAPP_URL+'?action=fgcari&palet='+encodeURIComponent(kode))
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res||!res.ok){ list.innerHTML='<div style="color:#B91C1C;font-weight:700">'+esc(res&&res.error?res.error:'Tidak ditemukan')+'</div>'; return; }
      fgCache=res.items||[];
      if(!fgCache.length){ list.innerHTML='<div style="color:var(--mute);font-size:12.5px">No. palet tidak ditemukan.</div>'; return; }
      var html='';
      fgCache.forEach(function(it,idx){
        html+='<div class="ul-item">'+
          '<div class="t">'+esc(it.palet)+'</div>'+
          '<div class="s">'+esc(it.namaProduk)+' | Qty '+esc(it.qty)+(it.gram!==''?' | Gram '+esc(it.gram):'')+'</div>'+
          '<div class="s">TF '+esc(it.tf)+' | '+esc(it.tanggalTxt)+' '+esc(it.jam)+' | Shift '+esc(it.shift)+'</div>'+
          '<div class="s">Operator: '+esc(it.nama)+'</div>'+
          '<button type="button" onclick="fgCetakUlang('+idx+')">🖨 Cetak Ulang</button>'+
          '</div>';
      });
      list.innerHTML=html;
    })
    .catch(function(e){ list.innerHTML='<div style="color:#B91C1C;font-weight:700">Gagal mencari: '+esc(e.message)+'</div>'; });
}

// Cetak ulang: hanya membaca data hasil cari, tidak menulis ke sheet dan tidak mengubah form
function fgCetakUlang(idx){
  var it=fgCache[idx];
  if(!it) return;
  var m={palet:it.palet, produk:it.namaProduk, qty:it.qty, gram:it.gram, tf:it.tf,
         tanggal:it.tanggal, jam:it.jam, shift:it.shift, nama:it.nama};
  fgCetakLabels([m], true);
}

// 5. Kosongkan form, satu-satunya cara untuk input baru
function fgKosongkan(){
  fgState=null;
  fgDraft=null;
  try{ localStorage.removeItem(FG_KEY); }catch(e){}
  document.getElementById('tbody').innerHTML='';
  fgTambahBaris();
  document.getElementById('fTanggal').value=tanggalHariIni();
  document.getElementById('fShift').value='';
  document.getElementById('fNama').value='';
  document.getElementById('palletInfo').style.display='none';
  document.getElementById('btnPrint').disabled=true;
  document.getElementById('btnShare').disabled=true;
  fgKunci(false);
  setMsg('Form dikosongkan. Siap untuk input berikutnya.','ok');
}

// Pulihkan data tersimpan jika halaman dibuka ulang
function fgPulihkan(){
  var raw=null;
  try{ raw=localStorage.getItem(FG_KEY); }catch(e){}
  if(!raw) return;
  try{
    fgState=JSON.parse(raw);
    var l=fgState.lines, h=l[0];
    document.getElementById('fTanggal').value=h.tanggal;
    document.getElementById('fShift').value=h.shift;
    document.getElementById('fNama').value=h.nama;
    document.getElementById('tbody').innerHTML='';
    l.forEach(function(it){
      fgTambahBaris({tf:it.tf, produk:it.produk, qty:it.qty, gram:it.gram, bs:it.bs, waste:it.waste, saldo:it.saldo});
    });
    fgKunci(true);
    fgTampilPalet(l);
    document.getElementById('btnPrint').disabled=false;
    document.getElementById('btnShare').disabled=false;
    setMsg('Ada data tersimpan. Tekan Cetak jika struk belum keluar, atau Kosongkan Form untuk input baru.','ok');
  }catch(e){ fgState=null; try{ localStorage.removeItem(FG_KEY); }catch(_){} }
}

// Daftar produk dari sheet CODE (F4:F), lalu baris pertama dibuat
function fgMuatProduk(cb){
  fetch(WEBAPP_URL+'?action=ukuranList')
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res&&res.ok) PRODUK_LIST=res.items||[];
      else setMsg('Gagal memuat produk: '+((res&&res.error)||''),'bad');
      cb();
    })
    .catch(function(){ setMsg('Gagal memuat daftar produk','bad'); cb(); });
}

function fgIsiSelect(selId, list){
  var sel=document.getElementById(selId);
  sel.innerHTML='<option value="">- pilih -</option>';
  list.slice().sort(function(a,b){ return a.localeCompare(b,'id'); }).forEach(function(n){
    var o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o);
  });
}

document.getElementById('fTanggal').value=tanggalHariIni();
fgIsiSelect('fNama', OPERATOR_LIST);
fgMuatProduk(function(){
  fgPulihkan();
  if(!fgState && document.getElementById('tbody').rows.length===0) fgTambahBaris();
});
</script>
