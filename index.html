<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Input Hasil Produksi FG</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D4E89">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root{--bg:#F3F4F6;--card:#FFF;--ink:#14181F;--mute:#5B6472;--line:#E3E6EA;--accent:#1D4E89;--good:#157F3C;--bad:#B91C1C;}
  *{box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:18px;margin:0;}
  h1{font-size:16px;font-weight:800;margin:0 0 2px;} .sub{font-size:11px;color:var(--mute);margin-bottom:16px;}
  #formCard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:420px;margin:0 auto;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mute);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .field input:disabled,.field select:disabled{background:#F3F4F6;color:var(--mute);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,78,137,.15);}
  .hint{font-size:11.5px;color:var(--mute);margin:-6px 0 14px;}
  .btn{width:100%;padding:13px;font-size:14px;font-weight:700;border:none;border-radius:8px;color:#fff;cursor:pointer;margin-top:8px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  #btnSave{background:var(--accent);margin-top:4px;}
  #btnPrint{background:#B45309;}
  #btnShare{background:#25D366;}
  #btnReset{background:#fff;color:var(--mute);border:1px solid var(--line);font-size:12.5px;padding:10px;}
  #msg{font-size:12.5px;margin-top:10px;min-height:16px;}
  #msg.ok{color:var(--good);font-weight:700;} #msg.bad{color:var(--bad);font-weight:700;}
  #kitirPrintArea{display:none;}
  .kitir{width:54mm;margin:0;font-family:'Roboto Mono',monospace;color:#000;padding:0;}
  .kitir .brand{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;}
  .kitir .judul{text-align:center;font-size:11.5px;font-weight:700;margin:1px 0 3px;}
  .kitir hr{border:none;border-top:1px dashed #000;margin:3px 0;}
  .kitir .ref{text-align:center;font-size:11px;font-weight:700;margin:1px 0 3px;}
  .kitir .nama{text-align:center;font-size:12px;font-weight:700;margin:3px 0;word-break:break-word;}
  .kitir .berat-wrap{text-align:center;margin:4px 0;}
  .kitir .berat-wrap .lbl{font-size:8.5px;letter-spacing:.08em;}
  .kitir .berat-wrap .val{font-size:20px;font-weight:700;line-height:1.1;}
  .kitir .rute{text-align:center;font-size:14px;font-weight:700;margin:3px 0;}
  .kitir .foot{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-top:3px;}
  .kitir .barcode-wrap{text-align:center;margin-top:5px;}
  .kitir .barcode-wrap svg{max-width:52mm;height:24mm;}
  @media print{
    body *{visibility:hidden;}
    #kitirPrintArea, #kitirPrintArea *{visibility:visible;}
    #kitirPrintArea{display:block;position:absolute;top:0;left:0;}
    @page{size:58mm auto;margin:0;}
  }
</style>
</head>
<body>
<h1>Input Hasil Produksi</h1>
<div class="sub">Isi data hasil produksi, lalu Simpan &amp; Cetak. Masuk ke sheet FG.</div>

<div id="formCard">
  <div class="row2">
    <div class="field"><label>Tanggal</label><input type="date" id="fTanggal"></div>
    <div class="field"><label>Shift</label>
      <select id="fShift"><option value="">- pilih -</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
    </div>
  </div>

  <div class="row2">
    <div class="field"><label>TF</label><select id="fTf"></select></div>
    <div class="field"><label>Jam</label><input type="time" id="fJam"></div>
  </div>

  <div class="field"><label>Nama Produk</label><select id="fProduk"><option value="">- memuat daftar -</option></select></div>

  <div class="row2">
    <div class="field"><label>Qty</label><input type="number" id="fQty" step="1" inputmode="numeric" placeholder="0"></div>
    <div class="field"><label>Gram</label><input type="number" id="fGram" step="any" inputmode="decimal" placeholder="0"></div>
  </div>

  <div class="row2">
    <div class="field"><label>Nama</label><input type="text" id="fNama" placeholder="Nama operator"></div>
    <div class="field"><label>BS Sheet</label><input type="number" id="fBsSheet" step="any" inputmode="decimal" placeholder="0"></div>
  </div>

  <div class="field"><label>Waste</label><input type="number" id="fWaste" step="any" inputmode="decimal" placeholder="0"></div>

  <div class="hint">No. Palet dibuat otomatis saat disimpan (format FG-YY/MM/NNN).</div>

  <button id="btnSave" class="btn" onclick="fgSimpanCetak()">Simpan &amp; Cetak</button>
  <button id="btnShare" class="btn" onclick="fgShareWa()" disabled>Share WA</button>
  <button id="btnReset" class="btn" onclick="fgKosongkan()">Kosongkan Form</button>
  <div id="msg"></div>
</div>

<div id="kitirPrintArea">
  <div class="kitir">
    <div class="brand">STP</div>
    <div class="judul">HASIL PRODUKSI FG</div>
    <div class="ref" id="pPalet">No. Palet: -</div>
    <hr>
    <div class="nama" id="pProduk">-</div>
    <div class="berat-wrap"><div class="lbl">QTY</div><div class="val" id="pQty">-</div></div>
    <div class="ref" id="pGram"></div>
    <div class="rute" id="pTf">-</div>
    <hr>
    <div class="foot"><span id="pTanggal">-</span><span id="pShift">-</span></div>
    <div class="foot"><span>Operator:</span><span id="pNama">-</span></div>
    <div class="barcode-wrap"><svg id="pBarcode"></svg></div>
  </div>
</div>

<script>
var WEBAPP_URL='https://script.google.com/macros/s/AKfycbxp5L0rGdC0ki2M18YjNnylr0aAOXDLCzW5k84fJhT7aCkdlFrPeOY2tH0b75MMjDJh/exec';
var TF_LIST=['TF5','TF6','TF7','TF8','TF9','TF10','TF12','TF13','TF14','TF15','TF16'];
var fgLast=null;

function setMsg(t,c){ var m=document.getElementById('msg'); m.textContent=t; m.className=c||''; }
function tanggalHariIni(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function jamSekarang(){ var n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
function fmtTglIndo(iso){ var p=String(iso).split('-'); return p.length===3 ? p[2]+'-'+p[1]+'-'+p[0] : iso; }

function fgIsiTf(){
  var sel=document.getElementById('fTf');
  sel.innerHTML='<option value="">- pilih -</option>';
  TF_LIST.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); });
}

// Daftar produk dari sheet CODE (F4:F), sama seperti daftar Ukuran di EXT
function fgMuatProduk(){
  fetch(WEBAPP_URL+'?action=ukuranList').then(r=>r.json()).then(res=>{
    var sel=document.getElementById('fProduk');
    sel.innerHTML='<option value="">- pilih -</option>';
    if(res&&res.ok){
      res.items.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); });
    } else { setMsg('Gagal memuat produk: '+((res&&res.error)||''),'bad'); }
  }).catch(function(){ setMsg('Gagal memuat daftar produk','bad'); });
}

function fgKunci(on){
  ['fTanggal','fShift','fTf','fJam','fProduk','fQty','fGram','fNama','fBsSheet','fWaste'].forEach(function(id){
    document.getElementById(id).disabled=on;
  });
  document.getElementById('btnSave').disabled=on;
}

function fgAmbilForm(){
  return {
    tanggal:document.getElementById('fTanggal').value,
    shift:document.getElementById('fShift').value,
    tf:document.getElementById('fTf').value,
    namaProduk:document.getElementById('fProduk').value,
    qty:document.getElementById('fQty').value.trim(),
    gram:document.getElementById('fGram').value.trim(),
    nama:document.getElementById('fNama').value.trim(),
    jam:document.getElementById('fJam').value || jamSekarang(),
    bsSheet:document.getElementById('fBsSheet').value.trim(),
    waste:document.getElementById('fWaste').value.trim()
  };
}

function fgValidasi(d){
  if(!d.tanggal) return 'Tanggal belum diisi';
  if(!d.shift) return 'Shift belum dipilih';
  if(!d.tf) return 'TF belum dipilih';
  if(!d.namaProduk) return 'Nama produk belum dipilih';
  if(!d.qty||isNaN(parseFloat(d.qty))||parseFloat(d.qty)<=0) return 'Qty belum valid';
  if(!d.nama) return 'Nama belum diisi';
  return null;
}

// 1. Simpan ke sheet FG (palet dibuat backend), lalu cetak struk
function fgSimpanCetak(){
  if(fgLast){ setMsg('Data sudah tersimpan. Tekan Kosongkan Form untuk input baru.','bad'); return; }
  var d=fgAmbilForm();
  var err=fgValidasi(d);
  if(err){ setMsg(err,'bad'); return; }

  var btn=document.getElementById('btnSave');
  btn.disabled=true; setMsg('Menyimpan...','');

  var payload={_app:'fg',tanggal:d.tanggal,shift:d.shift,tf:d.tf,namaProduk:d.namaProduk,
               qty:d.qty,gram:d.gram,nama:d.nama,jam:d.jam,bsSheet:d.bsSheet,waste:d.waste};

  fetch(WEBAPP_URL+'?action=save&payload='+encodeURIComponent(JSON.stringify(payload)))
    .then(r=>r.text())
    .then(t=>{
      var res;
      try{ res=JSON.parse(t); }catch(e){ res={ok:false,error:'Respon server: '+t.slice(0,200)}; }
      if(res&&res.ok&&res.palet){
        payload.palet=res.palet;
        fgLast=payload;
        fgKunci(true);
        document.getElementById('btnShare').disabled=false;
        fgIsiPreview(payload);
        setMsg('✅ Tersimpan. No. Palet '+res.palet+'. Tekan Share WA, lalu Kosongkan Form untuk input berikutnya.','ok');
        setTimeout(function(){ window.print(); }, 200);
      } else {
        btn.disabled=false;
        var pesan=(res&&res.error) ? res.error : 'Server tidak mengembalikan No. Palet. Cek deploy Apps Script.';
        setMsg('❌ Gagal: '+pesan,'bad');
      }
    })
    .catch(e=>{ btn.disabled=false; setMsg('❌ Gagal: '+e.message,'bad'); });
}

function fgIsiPreview(d){
  document.getElementById('pPalet').textContent='No. Palet: '+d.palet;
  document.getElementById('pProduk').textContent=d.namaProduk;
  document.getElementById('pQty').textContent=Number(d.qty).toLocaleString('id-ID')+' Box';
  document.getElementById('pGram').textContent=d.gram ? 'Gram: '+Number(d.gram).toLocaleString('id-ID') : '';
  document.getElementById('pTf').textContent=d.tf;
  document.getElementById('pTanggal').textContent=fmtTglIndo(d.tanggal)+' '+d.jam;
  document.getElementById('pShift').textContent='SHIFT '+d.shift;
  document.getElementById('pNama').textContent=d.nama;
  try{
    JsBarcode("#pBarcode", d.palet, {format:"CODE128", width:1.3, height:55, displayValue:true, fontSize:11, margin:2});
  }catch(e){
    document.getElementById('pBarcode').innerHTML='';
  }
}

// 2. Share WA: teks dari data yang sudah tersimpan, termasuk No. Palet dan Gram
function fgPesan(d){
  return "📦 HASIL PRODUKSI FG\n"+
    "Tanggal: "+fmtTglIndo(d.tanggal)+" | Jam: "+d.jam+"\n"+
    "Shift: "+d.shift+" | TF: "+d.tf+"\n"+
    "No. Palet: "+d.palet+"\n"+
    "Nama Produk: "+d.namaProduk+"\n"+
    "Qty: "+d.qty+"\n"+
    "Gram: "+(d.gram||'-')+"\n"+
    "Nama: "+d.nama;
}

function fgShareWa(){
  if(!fgLast){ setMsg('Simpan & Cetak dulu','bad'); return; }
  window.open("https://wa.me/?text="+encodeURIComponent(fgPesan(fgLast)),"_blank");
}

// 3. Kosongkan form, satu-satunya cara untuk input berikutnya
function fgKosongkan(){
  fgLast=null;
  ['fShift','fTf','fProduk','fQty','fGram','fNama','fBsSheet','fWaste'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('fTanggal').value=tanggalHariIni();
  document.getElementById('fJam').value=jamSekarang();
  document.getElementById('btnShare').disabled=true;
  fgKunci(false);
  setMsg('Form dikosongkan. Siap untuk input berikutnya.','ok');
}

document.getElementById('fTanggal').value=tanggalHariIni();
document.getElementById('fJam').value=jamSekarang();
fgIsiTf();
fgMuatProduk();
</script>
</body>
</html>
